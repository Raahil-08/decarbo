<svg width="64" height="64" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="decarbo-leaf-grad" x1="4" y1="4" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3A9B6F" />
      <stop offset="100%" stop-color="#2D7A57" />
    </linearGradient>
    <linearGradient id="decarbo-brass-grad" x1="36" y1="4" x2="4" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C6923B" />
      <stop offset="100%" stop-color="#A97A2B" />
    </linearGradient>
    <radialGradient id="decarbo-core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3A9B6F" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#3A9B6F" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Dark Base Background for Tab Visibility -->
  <rect width="40" height="40" rx="8" fill="#07090e" />

  <!-- Ambient Glow -->
  <circle cx="20" cy="20" r="14" fill="url(#decarbo-core-glow)" />

  <!-- Outer Hexagonal Carbon Lattice Ring -->
  <path
    d="M20 3.5L34.29 11.75V28.25L20 36.5L5.71 28.25V11.75L20 3.5Z"
    stroke="url(#decarbo-leaf-grad)"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Minimalist Inner 'D' -->
  <path
    d="M14 11V29M14 11H20.5C25.19 11 29 15.03 29 20C29 24.97 25.19 29 20.5 29H14"
    stroke="#F7F8FA"
    stroke-width="2.4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Decarbonisation Leaf Sweep -->
  <path
    d="M14 20C18.5 15 25.5 14 27.5 17C29.5 20 25.5 25.5 20 27"
    stroke="url(#decarbo-brass-grad)"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Vertex Nodes -->
  <circle cx="20" cy="3.5" r="2" fill="#3A9B6F" />
  <circle cx="34.29" cy="11.75" r="2" fill="#A97A2B" />
  <circle cx="34.29" cy="28.25" r="2" fill="#3A9B6F" />
  <circle cx="20" cy="36.5" r="2" fill="#A97A2B" />
  <circle cx="5.71" cy="28.25" r="2" fill="#3A9B6F" />
  <circle cx="5.71" cy="11.75" r="2" fill="#A97A2B" />

  <!-- Center Quantum Node -->
  <circle cx="20" cy="20" r="2.2" fill="#3A9B6F" />
</svg>