[project]
name = "decarbo-api"
version = "0.1.0"
description = "Decarbo backend API for SME decarbonisation planning"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2.0",
    "pint>=0.24",
    "pandas>=2.2.0",
    "openpyxl>=3.1.5",
    "pdfplumber>=0.11.0",
    "numpy>=2.0.0",
    "jinja2>=3.1.4",
    "anthropic>=0.34.0",
    "pyjwt[crypto]>=2.9.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "reportlab>=4.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
